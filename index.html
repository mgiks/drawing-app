<!doctype html>
<html lang="en" class="html">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drawing App</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" type="module"></script>
  </head>
  <body class="page">
    <canvas width="500" height="500" id="canvas" class="canvas"></canvas>
    <div id="drawingControls" class="drawing-controls">
      <div class="brush-resizer">
        <p>Brush size</p>
        <button id="brushSizeDecrementer" class="brush-resizer__button">
          -
        </button>
        <div id="brushSize" class="brush-resizer__value">10</div>
        <button id="brushSizeIncrementer" class="brush-resizer__button">
          +
        </button>
      </div>
      <div class="redo-undo">
        <button id="undoButton" class="redo-undo__button">&lt;</button>
        <button id="redoButton" class="redo-undo__button">&gt;</button>
      </div>
      <button id="clearCanvasButton" class="drawing-controls__clear-button">
        Clear
      </button>
    </div>
  </body>
</html>
